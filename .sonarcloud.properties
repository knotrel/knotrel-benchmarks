# SonarCloud automatic analysis settings.
#
# Every results/<campaign>/analyze.py is a frozen, per-campaign copy of the
# analysis that produced that campaign's outputs; campaign manifests record its
# sha256, so the copies are intentionally duplicated and must not be merged.
#
# Every results/<campaign>/diagnostics/<id>/ directory is the frozen source of
# one diagnostic as it ran (harnesses and probe variants such as D5-412's
# forced, instrumented and corrected probes, which differ by design in a few
# lines). Its reports cite that source; merging the copies would change what
# was measured.
#
# Exclude only these from copy-paste detection; they are still analysed for
# bugs, vulnerabilities and code smells.
sonar.cpd.exclusions=results/**/analyze.py,results/**/diagnostics/**
