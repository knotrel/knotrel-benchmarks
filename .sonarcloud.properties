# SonarCloud automatic analysis settings.
#
# Everything under results/ is frozen campaign evidence: per-campaign copies of
# the analysis and runner scripts (results/<campaign>/analyze.py, run_*.py),
# the source of each diagnostic as it ran (results/<campaign>/diagnostics/<id>/,
# including deliberate probe variants such as D5-412's forced, instrumented and
# corrected probes), and snapshots of the benchmark crate taken for a campaign
# (results/initialization/*/untracked/). Manifests and reports cite these files,
# often by sha256, so they must not be edited, merged or "fixed": doing so would
# change what was measured. Corrections go through explicit revisions.
#
# The live code that produces new evidence (crates/, tools/, scripts/,
# adapters/) stays fully analysed for duplication, bugs, vulnerabilities and
# code smells.
sonar.exclusions=results/**
