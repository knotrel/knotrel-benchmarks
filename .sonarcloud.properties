# SonarCloud automatic analysis settings.
#
# Every results/<campaign>/analyze.py is a frozen, per-campaign copy of the
# analysis that produced that campaign's outputs; campaign manifests record its
# sha256, so the copies are intentionally duplicated and must not be merged.
# Exclude only them from copy-paste detection; they are still analysed for
# bugs, vulnerabilities and code smells.
sonar.cpd.exclusions=results/**/analyze.py
