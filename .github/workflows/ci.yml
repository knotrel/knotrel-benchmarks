name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Knotrel core revision or branch
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knotrel-benchmarks
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: knotrel-benchmarks
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: knotrel/knotrel
          ref: ${{ inputs.core_ref || 'main' }}
          path: knotrel
          persist-credentials: false
      - name: Record core revision
        run: git -C ../knotrel rev-parse HEAD
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests and doctests
        run: cargo test --workspace --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Release smoke run
        run: cargo run --release --locked -- --nodes 128 --rounds 10 --seed 42
