# Standalone measurement tools for the hot-path audit campaign
# (results/hot-path-audit-20261114). Kept outside the root workspace on
# purpose: `router-probe` links the Elastic-2.0 `knotrel-server` crate and
# its HTTP stack, which must not enter the Apache-2.0 workspace lockfile or
# its cargo-deny license policy. See README.md.
[package]
name = "hot-path-probes"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
publish = false
description = "Router allocation/timing probe and job-tracking microbenchmark."

# Own workspace root: not a member of the knotrel-benchmarks workspace.
[workspace]

[features]
default = []
# Replace mimalloc with a counting wrapper around the system allocator.
count-alloc = ["dep:stats_alloc"]

[dependencies]
# Default path: the sibling `knotrel` checkout. The campaign collector
# rewrites this path to build baseline and candidate trees separately.
knotrel-server = { path = "../../../knotrel/crates/knotrel-server" }
axum = "0.8.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
prometheus-client = { version = "0.26", default-features = false }
bytes = "1"
stats_alloc = { version = "0.1.10", optional = true }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
