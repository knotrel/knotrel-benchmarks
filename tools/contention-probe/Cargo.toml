# Contention and batch-size probe for the v0.6.0 qualification (M5, M3.6).
# It drives a knotrel-server *process* over HTTP/1.1 and links no knotrel
# crate, so the same binary measures any server build. Own workspace root,
# outside the knotrel-benchmarks workspace (like tools/hot-path-probes).
[package]
name = "contention-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
publish = false
description = "Multi-client contention probe for a knotrel-server process."

[workspace]

[dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
