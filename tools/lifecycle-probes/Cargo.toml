[package]
name = "lifecycle-probes"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
publish = false
description = "Knotrel v0.5.0 node/edge lifecycle performance and resource probes."

[workspace]

[features]
default = []
count-alloc = ["dep:stats_alloc"]
# Peak live-heap tracking for the D4 memory diagnostic (memory-peak only).
peak-alloc = ["dep:cap"]

[dependencies]
knotrel-core = { path = "../../../knotrel/crates/knotrel-core" }
knotrel-server = { path = "../../../knotrel/crates/knotrel-server" }
# CF5 K4: the shared graph generator of the K2 cells (`knotrel_benchmarks::cf5`).
knotrel-benchmarks = { path = "../../crates/knotrel-benchmarks" }
axum = "0.8.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
rustc-hash = "2.1"
stats_alloc = { version = "0.1.10", optional = true }
cap = { version = "0.1.2", optional = true, features = ["stats"] }

[[bin]]
name = "memory-peak"
required-features = ["peak-alloc"]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
